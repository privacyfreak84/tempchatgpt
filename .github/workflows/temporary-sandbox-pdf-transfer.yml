name: temporary-sandbox-pdf-transfer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-sandbox-pdf-transfer.yml"

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package requested PDF
        run: |
          test -s "Electronics_Unit1_Master_Notes.pdf"
          file "Electronics_Unit1_Master_Notes.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: electronics-unit1-pdf-transfer
          path: Electronics_Unit1_Master_Notes.pdf
          if-no-files-found: error
          retention-days: 1
