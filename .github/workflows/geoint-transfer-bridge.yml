name: GeoINT binary transfer bridge

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/geoint-transfer-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-geoint-reference-data:
    runs-on: ubuntu-latest
    steps:
      - name: Download public GeoNames and aircraft reference datasets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p geoint-reference-data

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://download.geonames.org/export/dump/IN.zip" \
            --output geoint-reference-data/IN.zip

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://download.geonames.org/export/dump/countryInfo.txt" \
            --output geoint-reference-data/countryInfo.txt

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://download.geonames.org/export/dump/admin1CodesASCII.txt" \
            --output geoint-reference-data/admin1CodesASCII.txt

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://download.geonames.org/export/dump/cities500.zip" \
            --output geoint-reference-data/cities500.zip

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/wiedehopf/tar1090-db/master/db/icao_aircraft_types.js" \
            --output geoint-reference-data/icao_aircraft_types.js.gz

          echo "Downloaded file sizes:"
          du -h geoint-reference-data/*
          echo "SHA-256:"
          sha256sum geoint-reference-data/*
          file geoint-reference-data/*

      - name: Upload GeoINT reference pack as artifact
        uses: actions/upload-artifact@v4
        with:
          name: geoint-reference-pack
          path: geoint-reference-data/
          if-no-files-found: error
          retention-days: 1
